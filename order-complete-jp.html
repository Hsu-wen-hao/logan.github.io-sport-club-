<!DOCTYPE html>
<html lang="zh-Hant">
  <head>

    <link rel="stylesheet" href="assets/css/checkout-jp.css" />

  <body>
    <header>
      <div class="wrapper">
        <div class="brand">
          <span class="brand__symbol" aria-hidden="true">
            <img src="assets/images/logo-placeholder-100.svg" alt="" width="80" height="80" />

          <div class="brand__title">
            <span class="brand__name">動能運動生態平台</span>

          </div>
        </div>
        <a class="theme-switch" href="order-complete.html" aria-label="切換到 DARK 版">DARK</a>
        <ol class="progress">
          <li class="progress__step">
            <span class="progress__index">1</span>
            購物車
          </li>
          <li class="progress__step">
            <span class="progress__index">2</span>
            確認訂單內容
          </li>
          <li class="progress__step">
            <span class="progress__index">3</span>

            <span class="progress__index">4</span>

    <main>
      <section class="section">

          <div class="card order-status">
            <div class="order-status__symbol" aria-hidden="true">◎</div>

              您的訓練裝備已排入備貨流程，待完成出貨我們會再以電子郵件通知，請留意信箱與簡訊提醒。
            </p>
            <div class="actions" style="justify-content: center">
              <a class="btn btn--primary" href="shop-jp.html">返回商店</a>
              <a class="btn btn--ghost" href="cart-jp.html">再次前往選購</a>
            </div>
          </div>
        </div>
      </section>
    </main>
    <footer>
      <div class="wrapper">&copy; 2024 SPORTS ECOSYSTEM PLATFORM LIGHT. 陪你沉著備戰每一步。</div>
