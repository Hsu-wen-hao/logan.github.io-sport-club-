<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>訂單完成 | Motion Club Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/checkout.css" />
  </head>
  <body>
    <header>
      <div class="wrapper">
        <div class="brand">
          <span class="brand__symbol">MC</span>
          <div class="brand__title">Motion Club Store</div>
        </div>
        <a class="theme-switch" href="order-complete-jp.html" aria-label="切換到 LIGHT 版">LIGHT</a>
        <ol class="progress">
          <li class="progress__step">
            <span class="progress__index">1</span>
            購物車
          </li>
          <li class="progress__step">
            <span class="progress__index">2</span>
            確認訂單內容
          </li>
          <li class="progress__step">
            <span class="progress__index">3</span>
            結帳
          </li>
          <li class="progress__step progress__step--current">
            <span class="progress__index">4</span>
            完成
          </li>
        </ol>
      </div>
    </header>
    <main>
      <section class="section">
        <div class="wrapper">
          <h1>感謝您的訂購</h1>
          <p class="lead">
            已寄出訂單確認信至您的電子信箱，物流安排完成後將另行通知出貨明細。
          </p>
          <div class="card order-status">
            <div class="order-status__symbol" aria-hidden="true">◎</div>
            <h2>訂單編號：MC-20240501-872</h2>
            <p>
              訓練裝備即將啟程，出貨後我們會以電子郵件與簡訊同步告知物流追蹤碼，請保持手機暢通。
            </p>
            <div class="actions" style="justify-content: center">
              <a class="btn btn--primary" href="shop.html">返回商店</a>
              <a class="btn btn--ghost" href="cart.html">檢視其他裝備</a>
            </div>
          </div>
        </div>
      </section>
    </main>
    <footer>
      <div class="wrapper">&copy; 2024 Motion Club Store. 全方位支援你的賽季節奏。</div>
    </footer>
  </body>
</html>
